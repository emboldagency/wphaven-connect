name: WordPress Plugin Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

jobs:
  dist:
    uses: emboldagency/.github/.github/workflows/wp-release.yml@master
    with:
      plugin_slug: 'wphaven-connect'
      main_file: 'wphaven.php'
